# GONES45 — coupes d Europe : écart de coefficient UEFA → résultats réels (20261023m, à la main). Voir .github/scripts/coupes_europe.mjs.
name: coupes-europe
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  coupes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Calcul
        run: node .github/scripts/coupes_europe.mjs
      - name: Enregistrement
        run: |
          git config user.name "Coupes Europe"
          git config user.email "actions@users.noreply.github.com"
          git add "données/coupes_europe.json"
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Coupes d Europe : écart de coefficient"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
