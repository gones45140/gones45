# ═══════════════════════════════════════════════════════════════════════════
# GONES45 — TENDANCES OFFICIELLES (20261015i)
#
# Chaque jour à 10 h (Paris), le robot lance l'analyse Tendances avec les
# réglages officiels (cote mini 1,50, proba mini 50 %) et note les tendances
# AVANT les matchs dans données/tendances_officielles.json ; il juge aussi
# celles de la veille. Le même fichier est lu par tout le monde (gones45 et
# bet45) : un seul historique, publiable sur X, daté par GitHub.
#
# 17/10 (« au pire on met 8h ? ») : passage dès 8 h à Paris. Quatre crons (6, 7, 8, 9 h UTC) : 6 h UTC = 8 h l'été, 7 h UTC = 8 h l'hiver ;
# les suivants rattrapent les retards de GitHub (le 17/10, lancé à 13 h 51). Le script ne travaille qu'une fois par jour.
# Le script ne travaille qu'une fois par jour, à partir de 10 h à Paris.
# Bouton « Run workflow » : passage forcé (FORCE=1), pour un essai.
#
# données/ est exclu de pages.yml : ce commit ne republie pas le site.
# Minutes illimitées (dépôt public).
# ═══════════════════════════════════════════════════════════════════════════
name: tendances-officielles

on:
  # 21/10 (« les tendances n'arrivent pas avant 11 h 30 ») : les crons à l'heure pile partaient avec 3 à 5 h de RETARD (le 20/10, le
  # « 6 h UTC » a démarré à 10 h 47 UTC, soit 12 h 47 à Paris) — GitHub est saturé à minute 0. Minutes décalées (13 et 43) et un essai
  # toutes les 30 min de 6 h à 9 h 43 UTC : le premier qui passe après 8 h (Paris) travaille, les autres s'arrêtent en quelques secondes.
  schedule:
    - cron: '13,43 6-9 * * *'
  workflow_dispatch:

concurrency:
  group: tendances-officielles
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tendances:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Navigateur
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium

      # 20261020r : Elo tennis par surface (tennisabstract.com, 1 fois tous les 6 jours) → données/elo_tennis.json, AVANT l'analyse
      - name: Elo tennis
        continue-on-error: true
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node .github/scripts/elo.mjs

      - name: Analyse et vérification
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: node .github/scripts/tendances.mjs

      - name: Enregistrement
        run: |
          git config user.name "Tendances officielles"
          git config user.email "actions@users.noreply.github.com"
          git add "données/tendances_officielles.json"
          git add "données/elo_tennis.json" 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Tendances officielles $(TZ=Europe/Paris date +%d/%m/%Y)"
          # la synchro des paris pousse aussi sur main : on se recale avant chaque essai
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
