# GONES45 — 📦 archive des cotes d'avant-match (20261030y, Antoine : garder les cotes après le match, « dossier spécial » → données/cotes/).
# Toutes les 2 h (minute décalée : GitHub est saturé à la minute 0), matchs qui commencent dans les 4 h. Voir .github/scripts/cotes_archive.mjs.
name: cotes-archive
on:
  schedule:
    - cron: '27 */2 * * *'
  workflow_dispatch:
concurrency:
  group: cotes-archive
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cotes d'avant-match
        run: node .github/scripts/cotes_archive.mjs
      - name: Enregistrement
        run: |
          git config user.name "Archive cotes"
          git config user.email "actions@users.noreply.github.com"
          git add "données/cotes" 2>/dev/null || true
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "Cotes d'avant-match $(TZ=Europe/Paris date +'%d/%m %Hh%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
